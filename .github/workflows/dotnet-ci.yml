name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-test-package:
    name: Build, Test, Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore AOI_PCB_Database.slnx

      - name: Build milestone evidence CLI
        shell: pwsh
        run: dotnet build AOI_Monitor.Tools/AOI_Monitor.Tools.csproj --configuration Release --no-restore

      - name: Check PR quality expectations
        shell: pwsh
        run: ./Scripts/check-pr-quality.ps1

      - name: Check C# code quality
        shell: pwsh
        run: ./Scripts/check-code-quality.ps1

      - name: Run quality gates
        shell: pwsh
        run: ./Scripts/run-quality-gates.ps1 -Configuration Release -ResultsDirectory TestResults

      - name: Generate synthetic image-only learning smoke evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $imageLearningOutput = Join-Path (Get-Location) 'TestResults/image-learning-demo'
          $env:AOI_MONITOR_STORAGE_ROOT = Join-Path $imageLearningOutput 'runtime-storage-synthetic-not-acceptance'
          New-Item -ItemType Directory -Force -Path $imageLearningOutput, $env:AOI_MONITOR_STORAGE_ROOT | Out-Null

          dotnet run --project AOI_Monitor.Tools/AOI_Monitor.Tools.csproj --configuration Release --no-build -- client-image-learning-demo --synthetic --output $imageLearningOutput --operator ci-image-learning --false-call-target 0.05

          @(
            'Synthetic image-only learning CI smoke artifact.',
            'Synthetic only.',
            'Not customer acceptance.',
            'Not production model certification.',
            'Existing quality gates remain authoritative for CI health.'
          ) | Set-Content -Path (Join-Path $imageLearningOutput 'README_SYNTHETIC_NOT_CUSTOMER_ACCEPTANCE.txt') -Encoding UTF8

      - name: Generate simulation dry-run milestone evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $testResults = Join-Path (Get-Location) 'TestResults'
          $simRoot = Join-Path $testResults 'simulation-dry-run'
          $dataset = Join-Path $simRoot 'stage1-sample-dataset'
          $images = Join-Path $dataset 'images'
          $golden = Join-Path $dataset 'golden'
          $stage1Output = Join-Path $simRoot 'stage1-evidence-package'
          $stage2Output = Join-Path $simRoot 'stage2-camera-pilot-package'
          $env:AOI_MONITOR_STORAGE_ROOT = Join-Path $simRoot 'runtime-storage-not-acceptance'
          New-Item -ItemType Directory -Force -Path $images, $golden, $stage1Output, $stage2Output, $env:AOI_MONITOR_STORAGE_ROOT | Out-Null

          Add-Type -AssemblyName System.Drawing

          function Write-TinyImage {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$Kind,
              [int]$Index = 0
            )

            [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($Path)) | Out-Null
            $bitmap = [System.Drawing.Bitmap]::new(16, 16)
            try {
              for ($x = 0; $x -lt 16; $x++) {
                for ($y = 0; $y -lt 16; $y++) {
                  $color = switch ($Kind) {
                    'Bridge' { [System.Drawing.Color]::FromArgb(230, 20, 20); break }
                    'Missing' { [System.Drawing.Color]::FromArgb(20, 20, 20); break }
                    default { [System.Drawing.Color]::White; break }
                  }
                  $bitmap.SetPixel($x, $y, $color)
                }
              }

              $markerX = $Index % 16
              $markerY = [Math]::Floor($Index / 16) % 16
              $marker = switch ($Kind) {
                'OK' { [System.Drawing.Color]::FromArgb(245 - ($Index % 5), 245, 245); break }
                'Bridge' { [System.Drawing.Color]::FromArgb(180 + ($Index % 50), 0, 0); break }
                'Missing' { [System.Drawing.Color]::FromArgb($Index % 40, $Index % 40, $Index % 40); break }
                default { [System.Drawing.Color]::White; break }
              }
              $bitmap.SetPixel($markerX, $markerY, $marker)
              $bitmap.Save($Path, [System.Drawing.Imaging.ImageFormat]::Png)
            }
            finally {
              $bitmap.Dispose()
            }
          }

          $rows = [System.Collections.Generic.List[string]]::new()
          [void]$rows.Add('image,ground_truth,golden_image,defect_type,side,refdes,roi_id,roi_type,lot_id,board_model,notes')

          function Add-ManifestRow {
            param(
              [string]$Image,
              [string]$GroundTruth,
              [string]$DefectType,
              [string]$Refdes,
              [string]$RoiId
            )

            [void]$rows.Add("$Image,$GroundTruth,golden/golden_top.png,$DefectType,Top,$Refdes,$RoiId,Component,LOT-CI-SIM,TBOX-CI-SIM,simulation-dry-run generated tiny sample image")
          }

          Write-TinyImage -Path (Join-Path $golden 'golden_top.png') -Kind 'Golden'

          for ($i = 0; $i -lt 25; $i++) {
            $idx = '{0:D2}' -f $i
            $name = "board_ok_$idx.png"
            Write-TinyImage -Path (Join-Path $images $name) -Kind 'OK' -Index $i
            Add-ManifestRow -Image "images/$name" -GroundTruth 'OK' -DefectType 'OK' -Refdes "R-OK-$idx" -RoiId "ROI-OK-$idx"
          }

          for ($i = 0; $i -lt 13; $i++) {
            $idx = '{0:D2}' -f $i
            $name = "board_ng_bridge_$idx.png"
            Write-TinyImage -Path (Join-Path $images $name) -Kind 'Bridge' -Index $i
            Add-ManifestRow -Image "images/$name" -GroundTruth 'NG' -DefectType 'Solder Bridge' -Refdes "R-BR-$idx" -RoiId "ROI-BR-$idx"
          }

          for ($i = 0; $i -lt 12; $i++) {
            $idx = '{0:D2}' -f $i
            $name = "board_ng_missing_$idx.png"
            Write-TinyImage -Path (Join-Path $images $name) -Kind 'Missing' -Index $i
            Add-ManifestRow -Image "images/$name" -GroundTruth 'NG' -DefectType 'Missing Component' -Refdes "R-MC-$idx" -RoiId "ROI-MC-$idx"
          }

          $manifest = Join-Path $dataset 'customer_validation_manifest.csv'
          [IO.File]::WriteAllLines($manifest, $rows, [Text.Encoding]::UTF8)

          @(
            'simulation-dry-run evidence package',
            'Generated with tiny synthetic PNG images created in CI.',
            'No customer dataset, production model acceptance, vendor camera adapter, lighting controller, or real 3D acquisition hardware was validated.',
            'These artifacts exercise package plumbing only and are not customer or hardware acceptance evidence.'
          ) | Set-Content -Path (Join-Path $simRoot 'README_simulation-dry-run.txt') -Encoding UTF8

          dotnet run --project AOI_Monitor.Tools/AOI_Monitor.Tools.csproj --configuration Release --no-build -- stage1-exit --dataset $dataset --manifest $manifest --output $stage1Output --operator 'ci-simulation-dry-run' --allow-simulation
          dotnet run --project AOI_Monitor.Tools/AOI_Monitor.Tools.csproj --configuration Release --no-build -- stage2-camera-pilot --output $stage2Output --operator 'ci-simulation-dry-run' --allow-simulation

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload HMI layout audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmi-layout-audit
          path: |
            TestResults/hmi_layout_audit.json
            TestResults/hmi_layout_audit.html
          if-no-files-found: ignore

      - name: Upload UI navigation performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-navigation-performance
          path: TestResults/ui_navigation_performance.json
          if-no-files-found: ignore

      - name: Upload Stage 1 simulation dry-run evidence package
        uses: actions/upload-artifact@v4
        with:
          name: stage1-simulation-dry-run-evidence-package
          path: TestResults/simulation-dry-run/stage1-evidence-package
          if-no-files-found: error

      - name: Upload Stage 2 camera pilot simulation dry-run evidence package
        uses: actions/upload-artifact@v4
        with:
          name: stage2-camera-pilot-simulation-dry-run-evidence-package
          path: TestResults/simulation-dry-run/stage2-camera-pilot-package
          if-no-files-found: error

      - name: Upload image-learning report synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-learning-demo-report-synthetic-not-customer-acceptance
          path: |
            TestResults/image-learning-demo/README_SYNTHETIC_NOT_CUSTOMER_ACCEPTANCE.txt
            TestResults/image-learning-demo/README_CLIENT_IMAGE_LEARNING_DEMO.txt
            TestResults/image-learning-demo/visual_learning_report.html
            TestResults/image-learning-demo/visual_learning_report.json
            TestResults/image-learning-demo/learned_reference.png
            TestResults/image-learning-demo/learned_tolerance_map.png
            TestResults/image-learning-demo/before_after_false_call_report.html
            TestResults/image-learning-demo/before_after_results.csv
            TestResults/image-learning-demo/threshold_sweep.csv
            TestResults/image-learning-demo/inspection_results.csv
            TestResults/image-learning-demo/package_manifest.json
          if-no-files-found: error

      - name: Upload image-learning overlays synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: image-learning-demo-overlays-synthetic-not-customer-acceptance
          path: |
            TestResults/image-learning-demo/README_SYNTHETIC_NOT_CUSTOMER_ACCEPTANCE.txt
            TestResults/image-learning-demo/annotated_overlays
            TestResults/image-learning-demo/heatmaps
            TestResults/image-learning-demo/example_images
          if-no-files-found: error

      - name: Upload industrial quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-quality-gate-report
          path: |
            TestResults/industrial_quality_gate_report.json
            TestResults/pr_quality_gate_report.json
            TestResults/code_quality_report.json
            TestResults/standards_traceability_matrix.json
            TestResults/standards_traceability_matrix.html
            TestResults/standards_traceability_matrix.pdf
          if-no-files-found: ignore

      - name: Upload main branch package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AOI_Monitor_PoC
          path: TestResults/package_validation/AOI_Monitor_PoC_*
          if-no-files-found: error
