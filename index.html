<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCBA AOI Installation Monitor Prototype v10</title>
  <style>
    :root {
      --bg: #0b0e10;
      --window: #121619;
      --frame: #252c31;
      --frame-2: #1b2024;
      --cell: #151a1e;
      --cell-2: #1c2328;
      --line: #3d464d;
      --line-soft: #2d353b;
      --text: #d8dee3;
      --muted: #8b969e;
      --dim: #667078;
      --green: #50f56e;
      --green-soft: #2f7c3d;
      --red: #f13b3f;
      --red-soft: #7d2d2d;
      --amber: #e1a334;
      --blue: #5ca0d3;
      --cyan: #5cd6d0;
      --purple: #9f87ff;
      --white: #eef3f7;
      --black: #060708;
      --font: "Segoe UI", Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #050607;
      color: var(--text);
      font-family: var(--font);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 13px;
    }
    body.font-compact { font-size: 12px; }
    body.font-standard { font-size: 13px; }
    body.font-large { font-size: 15px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .workstation {
      width: min(1600px, 98vw);
      height: min(940px, 97vh);
      min-height: 780px;
      background: var(--window);
      border: 1px solid #505962;
      box-shadow: 0 0 0 2px #050607, 0 28px 80px rgba(0,0,0,.65);
      display: grid;
      grid-template-rows: 30px 36px 42px 1fr 26px;
      overflow: hidden;
    }

    .top-clockbar {
      background: #0a0d0f;
      border-bottom: 1px solid #20262a;
      display: grid;
      grid-template-columns: 92px 1fr auto;
      align-items: center;
    }
    .clock {
      height: 100%;
      display: grid;
      place-items: center;
      border-right: 1px solid #32383d;
      font-family: Consolas, "Courier New", monospace;
      font-size: 18px;
      color: #e8edf2;
      letter-spacing: 1px;
    }
    .system-title {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      min-width: 0;
    }
    .logo-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #9aa8b2;
      background: radial-gradient(circle at 35% 35%, #f33 0 15%, transparent 16%), radial-gradient(circle, #14301a 0, #14301a 55%, #060708 56%);
    }
    .title-main {
      font-weight: 700;
      letter-spacing: .08em;
      color: #e4e9ee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-sub {
      color: #9ba6ad;
      font-size: .82em;
      letter-spacing: .02em;
      margin-left: 8px;
      white-space: nowrap;
    }
    .header-indicators {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 18px;
      padding: 0 14px;
      border-left: 1px solid #252c31;
      color: #a8b2b9;
      font-size: .88em;
    }
    .led-row { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .led {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(80,245,110,.8);
    }
    .led.red { background: var(--red); box-shadow: 0 0 8px rgba(241,59,63,.8); }
    .led.amber { background: var(--amber); box-shadow: 0 0 8px rgba(225,163,52,.8); }

    .menubar {
      background: #161b1f;
      border-bottom: 1px solid #343c43;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }
    .menus { display: flex; height: 100%; }
    .menu-item {
      min-width: 88px;
      padding: 0 14px;
      border-right: 1px solid #2d343a;
      color: #bdc7ce;
      display: grid;
      place-items: center;
      font-size: .92em;
      white-space: nowrap;
    }
    .operator-band {
      display: flex;
      align-items: center;
      gap: 0;
      height: 100%;
      border-left: 1px solid #2d343a;
      overflow: hidden;
    }
    .op-cell {
      display: grid;
      grid-template-columns: auto auto;
      gap: 6px;
      align-items: center;
      height: 100%;
      padding: 0 12px;
      border-right: 1px solid #2d343a;
      color: #aab4bb;
      white-space: nowrap;
    }
    .op-cell b { color: #e7ecef; font-weight: 600; }

    .status-strip {
      background: var(--frame-2);
      border-bottom: 1px solid #3c444b;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0;
    }
    .status-cell {
      border-right: 1px solid #3b434a;
      padding: 6px 10px;
      min-width: 0;
    }
    .status-label { color: var(--muted); font-size: .78em; line-height: 1; margin-bottom: 3px; white-space: nowrap; }
    .status-value { color: #f0f5f8; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-value.green { color: var(--green); }
    .status-value.red { color: var(--red); }
    .status-value.amber { color: var(--amber); }

    .content {
      min-height: 0;
      display: grid;
      grid-template-columns: 170px 1fr;
      background: var(--bg);
    }

    .sidebar {
      border-right: 1px solid #4a535c;
      background: #111518;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }
    .station-id {
      padding: 10px 8px;
      border-bottom: 1px solid #363f46;
      display: grid;
      gap: 5px;
    }
    .station-code {
      border: 1px solid #58616a;
      background: #0b0e10;
      color: #e8edf2;
      padding: 8px;
      font-size: 1.2em;
      text-align: center;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .station-sub { color: #87939b; font-size: .82em; text-align: center; }
    .nav-stack { padding: 8px; overflow-y: auto; }
    .nav-btn {
      width: 100%;
      border: 1px solid #374047;
      background: #171d21;
      color: #c9d1d6;
      min-height: 44px;
      margin-bottom: 6px;
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      text-align: left;
      gap: 6px;
      padding: 5px 8px;
    }
    .nav-btn:hover { border-color: #5b6670; background: #1d252a; }
    .nav-btn.active {
      border-color: #82a8c2;
      background: #25313a;
      box-shadow: inset 3px 0 0 var(--blue);
      color: #f5f9fb;
    }
    .nav-no {
      color: #9eadb7;
      font-family: Consolas, monospace;
      font-size: .82em;
      text-align: center;
    }
    .nav-txt { font-weight: 600; line-height: 1.15; }
    .nav-sub { display: block; color: #7f8c95; font-size: .75em; margin-top: 2px; font-weight: 400; }
    .alarm-panel {
      border-top: 1px solid #3a4249;
      padding: 8px;
      background: #0c0f11;
    }
    .alarm-title { color: #f0a0a0; font-weight: 700; font-size: .82em; margin-bottom: 5px; }
    .alarm-line { color: #ed6262; font-size: .8em; line-height: 1.35; }

    .main-panel {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 30px 1fr;
    }
    .page-titlebar {
      background: #0f1316;
      border-bottom: 1px solid #30383f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      min-width: 0;
    }
    .page-title {
      color: #e8edf2;
      font-weight: 800;
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-actions { display: flex; gap: 6px; align-items: center; }
    .mini-btn {
      border: 1px solid #4b5660;
      background: #1a2126;
      color: #d2d9de;
      min-height: 22px;
      padding: 2px 8px;
      font-size: .84em;
    }
    .mini-btn.red { border-color: #854041; background: #351719; color: #ffbcbc; }
    .mini-btn.green { border-color: #3c7f4d; background: #14351d; color: #c1ffcb; }
    .mini-btn.amber { border-color: #806434; background: #332715; color: #ffe0a4; }
    .page-body { padding: 8px; overflow: auto; min-height: 0; }

    .grid { display: grid; gap: 8px; }
    .cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .cols-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }

    .panel {
      background: var(--cell);
      border: 1px solid #3e474e;
      min-width: 0;
      min-height: 0;
    }
    .panel-head {
      min-height: 25px;
      border-bottom: 1px solid #343d44;
      background: #1a2024;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      gap: 8px;
    }
    .panel-title {
      color: #dce5eb;
      font-weight: 800;
      font-size: .9em;
      letter-spacing: .03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-sub { color: #81909a; font-size: .78em; white-space: nowrap; }
    .panel-body { padding: 8px; }

    .kpi-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
    .kpi {
      background: #151a1e;
      border: 1px solid #3d454c;
      min-height: 104px;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .kpi .panel-head { min-height: 24px; }
    .kpi-content { display: grid; grid-template-columns: 1fr 84px; gap: 8px; padding: 7px; align-items: center; }
    .kpi-number { color: #f2f7fa; font-size: 1.65em; font-weight: 800; line-height: 1; }
    .kpi-label { color: #9fa9b1; font-size: .78em; margin-top: 5px; }
    .kpi-foot { color: #68757d; font-size: .75em; margin-top: 4px; }

    .gauge {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: conic-gradient(var(--green) calc(var(--v) * 1%), #363d42 0);
    }
    .gauge.red { background: conic-gradient(var(--red) calc(var(--v) * 1%), #363d42 0); }
    .gauge.amber { background: conic-gradient(var(--amber) calc(var(--v) * 1%), #363d42 0); }
    .gauge::after {
      content: "";
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #121619;
      position: absolute;
    }
    .gauge span { position: relative; z-index: 1; font-size: .85em; font-weight: 800; color: #dce5eb; }

    .production-grid {
      display: grid;
      grid-template-columns: 1.15fr 1.25fr 1.45fr;
      gap: 8px;
      margin-top: 8px;
      min-height: 280px;
    }
    .station-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .station-card {
      border: 1px solid #3d464d;
      background: #14191d;
      display: grid;
      grid-template-rows: 25px auto auto auto;
      min-width: 0;
    }
    .station-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #343b42;
      padding: 3px 6px;
      color: #d9e1e6;
      font-weight: 800;
      background: #191f23;
    }
    .station-head.red { background: #d6131a; color: #fff; }
    .station-body { padding: 8px; display: grid; grid-template-columns: 1fr 70px; gap: 6px; align-items: center; }
    .station-metrics { display: grid; gap: 4px; color: #aab4bb; font-size: .82em; }
    .station-metrics b { color: #eef3f7; }
    .bar-list { padding: 0 8px 7px; display: grid; gap: 4px; }
    .bar-row { display: grid; grid-template-columns: 58px 1fr 30px; gap: 5px; align-items: center; font-size: .74em; color: #8c98a1; }
    .bar-track { height: 8px; background: #262d32; border: 1px solid #343c42; }
    .bar-fill { height: 100%; background: #7896c0; width: var(--w); }
    .bar-fill.red { background: #c34141; }
    .bar-fill.amber { background: #c58b31; }
    .disposition-tag {
      margin: 0 8px 8px;
      min-height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid #4b5b6c;
      background: #26384d;
      color: #d8e9ff;
      font-weight: 700;
      text-align: center;
      font-size: .82em;
    }
    .disposition-tag.orange { background: #8a570f; border-color: #cf8d28; color: #fff1c5; }
    .disposition-tag.red { background: #581b1d; border-color: #a83a3e; color: #ffcece; }
    .disposition-tag.green { background: #173a21; border-color: #3e844a; color: #cfffce; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #343d44; padding: 5px 6px; text-align: left; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { background: #222a30; color: #c9d2d8; font-size: .82em; font-weight: 800; }
    td { color: #c3ccd3; font-size: .82em; background: #151a1e; }
    tr:nth-child(even) td { background: #171d21; }
    tr.selected td { background: #273642; }
    .chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #51606b; background: #20282e; color: #dce5eb; padding: 2px 6px; font-size: .78em; font-weight: 700; white-space: nowrap; }
    .chip.red { border-color: #9a393e; background: #35191b; color: #ffbfc1; }
    .chip.green { border-color: #377849; background: #14311d; color: #c6ffd0; }
    .chip.amber { border-color: #8c6c35; background: #372914; color: #ffe0a7; }
    .chip.blue { border-color: #477ca5; background: #172a39; color: #c8eaff; }
    .chip.purple { border-color: #6652a7; background: #28213d; color: #ded7ff; }

    .chart {
      height: 192px;
      border: 1px solid #30383e;
      background:
        linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px),
        #101417;
      background-size: 42px 100%, 100% 32px;
      position: relative;
      overflow: hidden;
    }
    .line-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .legend { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: #89959d; font-size: .78em; margin-top: 6px; }
    .legend-dot { width: 10px; height: 3px; display: inline-block; background: var(--green); margin-right: 4px; vertical-align: middle; }
    .legend-dot.red { background: var(--red); } .legend-dot.amber { background: var(--amber); } .legend-dot.blue { background: var(--blue); }

    .review-layout { display: grid; grid-template-columns: 340px 1fr 340px; gap: 8px; height: 100%; min-height: 665px; }
    .queue { overflow: auto; max-height: 610px; }
    .image-stage {
      display: grid;
      grid-template-rows: 34px 1fr 112px;
      min-height: 0;
      height: 100%;
    }
    .tool-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-bottom: 1px solid #343d44; background: #151b1f; overflow: hidden; }
    .pcb-view {
      position: relative;
      margin: 8px;
      border: 1px solid #59636b;
      background: #0e1214;
      overflow: hidden;
      min-height: 360px;
    }
    .pcb-board {
      position: absolute;
      inset: 32px 55px;
      background:
        radial-gradient(circle at 20% 25%, rgba(185,205,120,.12) 0 2px, transparent 3px),
        radial-gradient(circle at 74% 55%, rgba(185,205,120,.10) 0 2px, transparent 3px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px),
        #164321;
      background-size: auto, auto, 34px 34px, 34px 34px, auto;
      border: 2px solid #5a8c59;
      box-shadow: inset 0 0 32px rgba(0,0,0,.45);
    }
    .component { position: absolute; background: #20272b; border: 1px solid #8c9ba4; color: #cad4da; display: grid; place-items: center; font-size: .7em; }
    .c1 { left: 12%; top: 18%; width: 120px; height: 70px; }
    .c2 { right: 15%; top: 18%; width: 92px; height: 58px; }
    .c3 { left: 32%; top: 42%; width: 168px; height: 82px; }
    .c4 { right: 18%; bottom: 20%; width: 142px; height: 64px; }
    .c5 { left: 14%; bottom: 22%; width: 88px; height: 52px; }
    .defect-box { position: absolute; border: 2px solid var(--red); box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 0 16px rgba(241,59,63,.65); }
    .defect-box::after { content: attr(data-label); position: absolute; left: -2px; top: -22px; background: var(--red); color: #fff; padding: 2px 5px; font-size: .72em; font-weight: 800; white-space: nowrap; }
    .roi-box { position: absolute; border: 1px dashed var(--amber); }
    .crosshair-h, .crosshair-v { position: absolute; background: rgba(92,160,211,.45); pointer-events: none; }
    .crosshair-h { left: 0; right: 0; height: 1px; top: 54%; }
    .crosshair-v { top: 0; bottom: 0; width: 1px; left: 58%; }
    .image-footer { padding: 8px; border-top: 1px solid #343d44; background: #111619; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fieldbox { border: 1px solid #3a444b; background: #151b1f; padding: 6px; min-width: 0; }
    .field-label { color: #7f8c95; font-size: .75em; margin-bottom: 2px; }
    .field-value { color: #eef3f7; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .similar-grid { display: grid; gap: 7px; }
    .sim-card { display: grid; grid-template-columns: 78px 1fr; gap: 7px; border: 1px solid #3a444b; background: #141a1e; padding: 6px; }
    .sim-thumb { background: #183d22; border: 1px solid #52605a; position: relative; min-height: 56px; }
    .sim-thumb::after { content:""; position: absolute; left: 42%; top: 35%; width: 20px; height: 14px; border: 2px solid var(--red); }
    .sim-info { min-width: 0; display: grid; gap: 2px; color: #aeb8bf; font-size: .78em; }
    .sim-info b { color: #e7edf2; }

    .form-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 8px; align-items: center; }
    .form-grid label { color: #9aa6af; font-size: .85em; }
    input, select {
      width: 100%;
      background: #0f1316;
      border: 1px solid #4a535c;
      color: #e7edf2;
      min-height: 28px;
      padding: 3px 6px;
    }
    input[readonly] { color: #99a4ab; background: #101417; }
    .btn-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
    .action-btn {
      border: 1px solid #5a646d;
      background: #222a30;
      color: #e8eef2;
      min-height: 32px;
      padding: 5px 12px;
      font-weight: 700;
    }
    .action-btn.red { border-color: #a13a3f; background: #4a171a; color: #ffd0d2; }
    .action-btn.green { border-color: #3c8d50; background: #17391f; color: #d1ffd8; }
    .action-btn.amber { border-color: #987538; background: #3f2c13; color: #ffe3ad; }
    .action-btn.blue { border-color: #4b87b4; background: #173047; color: #cfeaff; }

    .recipe-matrix { display: grid; grid-template-columns: 180px repeat(6, 1fr); border: 1px solid #3c454c; }
    .matrix-cell { border-right: 1px solid #3c454c; border-bottom: 1px solid #3c454c; min-height: 42px; padding: 6px; background: #151a1e; color: #c6d0d7; font-size: .82em; }
    .matrix-head { background: #242c32; color: #e1e8ed; font-weight: 800; }
    .matrix-cell.ok { color: #c8ffd0; } .matrix-cell.warn { color: #ffe1a3; } .matrix-cell.ng { color: #ffc3c4; }

    .footerbar {
      background: #0a0d0f;
      border-top: 1px solid #374047;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      color: #8d99a1;
      font-size: .82em;
      min-width: 0;
    }
    .footer-left, .footer-right { display: flex; gap: 14px; min-width: 0; align-items: center; }
    .footerbar b { color: #d4dde3; }

    .bottom-alarm {
      margin-top: 8px;
      border: 1px solid #4b2325;
      background: #14080a;
      color: #f27777;
      padding: 7px 10px;
      text-align: center;
      font-weight: 800;
      letter-spacing: .02em;
    }

    @media (max-width: 1180px) {
      .workstation { width: 100vw; height: 100vh; min-height: 720px; }
      .content { grid-template-columns: 146px 1fr; }
      .kpi-strip, .status-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .production-grid, .review-layout { grid-template-columns: 1fr; height: auto; }
      .station-grid { grid-template-columns: repeat(2, 1fr); }
      .cols-6, .cols-5, .cols-4, .cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    function renderInstall() {
      const rows = t('install.runtimeRows');
      const runtime = `<table><thead><tr><th>${L('Runtime Element','실행 요소')}</th><th>${t('common.status')}</th><th>${L('Purpose','목적')}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${chip(r[1], i===3?'amber':'green')}</td><td style="white-space:normal;line-height:1.35">${r[2]}</td></tr>`).join('')}</tbody></table>`;
      const boundary = `<table><tbody>${t('install.boundaryRows').map(r=>`<tr><td style="width:190px;font-weight:800;color:#dce5eb">${r[0]}</td><td style="white-space:normal;line-height:1.35">${r[1]}</td></tr>`).join('')}</tbody></table>`;
      const guiRole = `<div class="grid cols-2">${metricField(L('Core runtime','핵심 실행'), L('Background service','백그라운드 서비스'))}${metricField(L('Visible GUI','표시 GUI'), L('Monitor + review console','모니터 + 검토 콘솔'))}${metricField(L('Default visible page','기본 표시 화면'), L('Station Monitor','스테이션 모니터'))}${metricField(L('Operator dependency','작업자 의존도'), L('Review / exception only','검토 / 예외 상황 중심'))}</div>`;
      document.getElementById("pageBody").innerHTML = `<div class="grid cols-2">${panel(t('panels.installRuntime'), runtime)}${panel(t('panels.installGui'), guiRole)}</div><div style="margin-top:8px">${panel(t('panels.installBoundary'), boundary)}</div><div class="bottom-alarm">${L('Confirmed design clue applied: the GUI is treated as an installed monitoring/review console while the inspection can run in the background.', '확인된 설계 단서 적용: GUI는 설치형 모니터/검토 콘솔로 두고, 검사는 백그라운드에서 실행될 수 있는 구조로 표현했습니다.')}</div>`;
    }

    function renderSettings() {
      const langOpt = t('settings.langOptions');
      const fontOpt = t('settings.fontOptions');
      const settings = `<div class="form-grid">
        <label>${t('settings.language')}</label><select id="langSelect"><option value="en" ${lang==='en'?'selected':''}>${langOpt.en}</option><option value="ko" ${lang==='ko'?'selected':''}>${langOpt.ko}</option></select>
        <label>${t('settings.font')}</label><select id="fontSelect"><option value="compact" ${fontSize==='compact'?'selected':''}>${fontOpt.compact}</option><option value="standard" ${fontSize==='standard'?'selected':''}>${fontOpt.standard}</option><option value="large" ${fontSize==='large'?'selected':''}>${fontOpt.large}</option></select>
        <label>${t('settings.storage')}</label><input readonly value="D:/AOI_DB/TBOX_MAIN/image_vault/">
        <label>${t('settings.reviewDefault')}</label><input readonly value="${t('settings.reviewMode')}">
      </div><div class="btn-row"><button class="action-btn green" onclick="applySettings()">${t('common.apply')}</button><button class="action-btn">${t('common.reset')}</button></div>`;
      const notes = `<div class="fieldbox"><div class="field-label">${L('Localization','언어 전환')}</div><div class="field-value" style="white-space:normal;line-height:1.4">${t('settings.systemLanguageNote')}</div></div><div class="fieldbox" style="margin-top:8px"><div class="field-label">${L('Configuration Policy','설정 정책')}</div><div class="field-value" style="white-space:normal;line-height:1.4">${t('settings.operatorNote')}</div></div>`;
      document.getElementById("pageBody").innerHTML = `<div class="grid cols-2">${panel(t('panels.settings'), settings)}${panel(t('panels.localization'), notes)}</div>`;
      document.getElementById('langSelect').addEventListener('change', e => { lang = e.target.value; localStorage.setItem('aoiLangV9', lang); render(); });
      document.getElementById('fontSelect').addEventListener('change', e => { fontSize = e.target.value; localStorage.setItem('aoiFontV9', fontSize); setFontClass(); });
    }

    function renderGuide() {
      const steps = `<table><tbody>${t('guide').map((g,i)=>`<tr><td style="width:52px">${String(i+1).padStart(2,'0')}</td><td>${g}</td><td>${chip(i<2?L('MANDATORY','필수'):L('CHECK','확인'), i<2?'red':'blue')}</td></tr>`).join('')}</tbody></table>`;
      const status = `<div class="grid cols-3">${metricField(L('Default policy','기본 정책'), t('settings.reviewMode'))}${metricField(L('Primary evidence','주요 증거'), L('Image + ROI + GT + AI result','이미지 + ROI + 실제 + AI 결과'))}${metricField(L('Commissioning mode','시운전 모드'), L('local database / no MES writeback','로컬 DB / MES 쓰기 없음'))}</div>`;
      document.getElementById("pageBody").innerHTML = `${panel(t('panels.guide'), steps)}<div style="margin-top:8px">${panel(L('Guide Header','가이드 헤더'), status)}</div>`;
    }

    function setPage(p) { activePage = p; render(); }
    function applySettings() { alert(t('toastSaved')); }
    function render() {
      renderChrome();
      if (activePage === "monitor") renderMonitor();
      if (activePage === "review") renderReview();
      if (activePage === "library") renderLibrary();
      if (activePage === "recipe") renderRecipe();
      if (activePage === "spc") renderSpc();
      if (activePage === "reports") renderReports();
      if (activePage === "install") renderInstall();
      if (activePage === "settings") renderSettings();
      if (activePage === "guide") renderGuide();
      tickClock();
    }
    render();
  </script>
</body>
</html>
